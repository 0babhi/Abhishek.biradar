name: Sync Portfolio Projects

on:
  push:
    branches:
      - main
    paths:
      - "projects/**/project.json"
      - "scripts/sync_projects.py"
      - ".github/workflows/project-sync.yml"
      - "index.html"

permissions:
  contents: write

jobs:
  sync-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate project pages and cards
        run: python scripts/sync_projects.py

      - name: Save generated changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html projects
            git commit -m "Automatically update portfolio projects"
            git push
          else
            echo "No generated changes."
          fi
